name: CI

# Product Forge is a "spec-as-product": its correctness is the internal
# consistency of its docs/commands/manifests plus the four zero-dependency
# helper scripts. This workflow is the automated consistency gate that the
# v1.6 documentation pass lacked — it runs the aggregate self-check on every
# push and PR so doc-vs-doc drift and dead config switches cannot land silently.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  doctor:
    name: doctor (self-tests + lint-docs + invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run aggregate self-check
        # doctor.js runs every script --selftest, the doc-corpus linter, and the
        # release-blocking invariants (version sync, command-count parity,
        # no-escape-above-plugin-root). Exit 1 fails the job.
        run: node scripts/doctor.js

      - name: Doc-corpus lint (full report, warnings included)
        # doctor blocks only on error-severity findings; this surfaces warnings
        # too (annotations) without failing the build on a warn.
        run: node scripts/lint-docs.js || true

  plugin-validate:
    name: claude plugin validate (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true   # the Claude CLI may be unavailable on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin manifests
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not installed on runner — skipping (manifests are also shape-checked by doctor's version/command-count invariants)."
          fi

  external-links:
    name: external-link liveness (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # network-dependent; never blocks a merge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe external links
        # Advisory: surfaces stale install URLs / upstream repos. Illustrative
        # (localhost/example), placeholder, and own-repo URLs are filtered out.
        # Not run with --strict, so dead links annotate but don't fail the merge.
        run: node scripts/check-links.js --timeout 8000

