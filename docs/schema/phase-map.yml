# Canonical phase map — the SINGLE SOURCE for Product Forge's phase set and the
# per-mode applicability matrix.
#
# Product Forge restates the phase map in two forge.md tables (the standard-mode
# "Phase Map" and the "Phase execution map by mode"), plus prose in policy.md /
# phases.md / how-it-works. Historically those drifted (14-vs-18 phase counts).
# This file is the machine-readable source; scripts/lint-docs.js (PHASEMAP rule)
# reads it and asserts the forge.md tables agree — every phase id present in both,
# the row counts equal, and each per-mode cell matching.
#
# This realizes step 3 of docs/improvements/2026-06-schema-as-source-design-note.md
# (the enum single-source was step 2). It is the DATA; the forge.md tables remain
# the human-readable rendering — keep them in sync (the linter enforces it).
#
# applicability values:
#   yes  — phase runs in this mode (the ✅ cell, incl. "✅ (minimal)/(light)/(inline)")
#   opt  — optional/skippable in this mode (the "opt" cell, incl. conditional ones)
#   no   — not in scope for this mode (the "—" cell)
#
# V-Model's V1–V13 progression is a separate extension pack (see
# docs/v-model-integration.md), not part of this core PF phase set.
schema_version: 1

phases:
  - id: "0"
    name: "Problem Discovery"
    command: "speckit.product-forge.problem-discovery"
    modes: { express: no, lite: opt, standard: opt, v-model: opt }
